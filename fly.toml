app = 'qcam'
primary_region = 'iad'

[build]

# 1. WebRTC & API Service
[[services]]
  internal_port = 8889
  protocol = "tcp"
  # Keep the server running to avoid cold starts during streaming
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  # Health checks with grace period to prevent boot loops
  [[services.tcp_checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "30s"

# 2. RTSP Streaming Service
[[services]]
  internal_port = 8554
  protocol = "tcp"
  [[services.ports]]
    port = 8554

[env]
  MTX_PROTOCOLS = "tcp"
  MTX_WEBRTC_ADDITIONAL_HOSTS = "qcam.fly.dev"
