<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCam Global Control</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <style>
        body { background: #121212; color: #ffffff; text-align: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .container { max-width: 900px; margin: 40px auto; padding: 20px; }
        .video-box { width: 100%; border-radius: 12px; border: 4px solid #333; overflow: hidden; background: #000; }
        .btn { padding: 16px 32px; font-size: 18px; font-weight: bold; background: #2ecc71; color: white; border: none; cursor: pointer; border-radius: 8px; margin-top: 30px; transition: 0.3s; }
        .btn:hover { background: #27ae60; }
        #snap-img { max-width: 100%; margin-top: 30px; display: none; border: 2px solid #fff; border-radius: 8px; }
        #status { margin-top: 15px; color: #bdc3c7; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <h1>QCam Live Feed</h1>
        <div class="video-box">
            <video id="vid" class="video-js vjs-default-skin vjs-16-9" controls autoplay muted>
                <source src="{{ rpi_url }}/hls/stream.m3u8" type="application/x-mpegURL">
            </video>
        </div>
        
        <button class="btn" onclick="takeSnapshot()">CAPTURE SNAPSHOT</button>
        <div id="status">System Ready</div>
        <img id="snap-img" src="" alt="Live Snapshot">
    </div>

    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script>
        async function takeSnapshot() {
            const status = document.getElementById('status');
            const img = document.getElementById('snap-img');
            status.innerText = "Requesting image from Raspberry Pi...";
            
            try {
                const res = await fetch('/api/snapshot');
                const data = await res.json();
                if(data.status === "success") {
                    // Bypass browser cache with timestamp
                    img.src = "{{ rpi_url }}/captures/snap.jpg?t=" + new Date().getTime();
                    img.style.display = "inline-block";
                    status.innerText = "Snapshot successfully updated!";
                } else {
                    status.innerText = "Error: " + data.message;
                }
            } catch (e) {
                status.innerText = "Connection Failed: Check if Pi is online.";
            }
        }
    </script>
</body>
</html>
