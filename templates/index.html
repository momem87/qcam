<!DOCTYPE html>
<html>
<head>
    <title>QCam Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #1a1a1a; color: white; text-align: center; font-family: sans-serif; }
        img { width: 90%; max-width: 800px; border: 3px solid #444; border-radius: 8px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>QCam Live Feed</h1>
    <img src="/live" id="cam">
    <script>
        // Refresh the image every 3 seconds
        setInterval(() => {
            document.getElementById('cam').src = '/live?t=' + Date.now();
        }, 3000);
    </script>
</body>
</html>
